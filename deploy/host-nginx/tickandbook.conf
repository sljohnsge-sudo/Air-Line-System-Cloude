# Tick and Book — HTTPS front door on the SERVER itself (not inside Docker),
# 16/11/2026. Sends tickandbook.com to the website container (:5176) and
# admin.tickandbook.com to the admin-site container (:5177).
#
# Install (Ubuntu/Debian):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/host-nginx/tickandbook.conf /etc/nginx/sites-available/tickandbook.conf
#   sudo ln -s /etc/nginx/sites-available/tickandbook.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tickandbook.com -d www.tickandbook.com -d admin.tickandbook.com
# certbot adds the certificate lines and the http -> https redirect itself.

# Website: tickandbook.com (+ www)
server {
    listen 80;
    server_name tickandbook.com www.tickandbook.com;
    server_tokens off;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The container's nginx reads the visitor's real address from this.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # After certbot has made the site HTTPS, uncomment (browsers then always use HTTPS):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Admin site: admin.tickandbook.com (staff only)
server {
    listen 80;
    server_name admin.tickandbook.com;
    server_tokens off;
    client_max_body_size 50M;

    # Optional: let only office / VPN addresses in (the staff login protects it anyway).
    # allow 203.0.113.10;     # office public IP
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:5177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
