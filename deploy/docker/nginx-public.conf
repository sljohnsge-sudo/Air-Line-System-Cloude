# airline-site image (tickandbook.com): the FRONTEND container (ROLE=frontend).
# nginx serves the customer website from /app/frontend and passes /api/ and
# /uploads/ to the BACKEND container (airline_site_backend:8000). 16/11/2026.
#
# deploy/docker/start.sh writes __API_UPSTREAM__ (host:port of the backend
# container) when the container starts.
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    root /app/frontend;

    # The backend container, looked up through Docker's own name service at
    # request time: this container starts (and serves the site) even while
    # the backend container is stopped; /api/ then answers 503.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "__API_UPSTREAM__";
    index index.html;
    client_max_body_size 50M;

    # Real visitor address. On the server an HTTPS proxy (deploy/host-nginx/)
    # sits in front of this container, so every request arrives from a private
    # address. Trust X-Forwarded-For only from private/loopback addresses and
    # take the last address that is not one of them — the real visitor. The
    # backend's rate limits and IP blocks depend on this
    # (TRUST_PROXY_HEADERS=true, last X-Forwarded-For entry).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers (repeated in each location below: nginx drops
    # server-level add_header lines in any location that has its own).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse proxy for the customer-site backend (APP_MODE=public)
    location /api/ {
        proxy_pass http://$api_upstream;
        error_page 502 504 = @api_down;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The real visitor only (see set_real_ip_from above), so a visitor
        # can't fake their address by sending their own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Uploaded images (tour package posters), served by the backend from the
    # shared uploads volume.
    location /uploads/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static Assets with long cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Single Page Application (SPA) routing fallback; index.html is never
    # cached so a new deploy is picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Backend container stopped or still starting: a short JSON answer the
    # site can show, instead of nginx's 502 page.
    location @api_down {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"detail":"Service temporarily unavailable. Please try again in a moment."}';
    }
}
