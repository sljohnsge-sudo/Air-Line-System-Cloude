# airline-admin image (admin.tickandbook.com, staff only): the FRONTEND
# container (ROLE=frontend). nginx serves the admin site from /app/frontend and
# passes /api/ and /uploads/ to the BACKEND container (airline_admin_backend:8000).
# Search engines are told not to index it. 16/11/2026.
#
# deploy/docker/start.sh writes __API_UPSTREAM__ (host:port of the backend
# container) when the container starts.
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    root /app/frontend;

    # The backend container, looked up through Docker's own name service at
    # request time: this container starts (and serves the site) even while
    # the backend container is stopped; /api/ then answers 503.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "__API_UPSTREAM__";
    index index.html;
    client_max_body_size 50M;

    # Real visitor address behind the HTTPS proxy (see nginx.conf).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Admin backend (APP_MODE=admin): staff routes only
    location /api/ {
        proxy_pass http://$api_upstream;
        error_page 502 504 = @api_down;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Uploaded images (same shared volume as the customer site)
    location /uploads/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Backend container stopped or still starting: a short JSON answer the
    # site can show, instead of nginx's 502 page.
    location @api_down {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"detail":"Service temporarily unavailable. Please try again in a moment."}';
    }
}
