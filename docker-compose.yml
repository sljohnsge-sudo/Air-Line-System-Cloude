# ==========================================
# Tick and Book - two images, two containers (16/11/2026)
# Host Server: 172.16.7.41
#
#   airline_site   image tickbook/airline-site   port 5176   tickandbook.com
#                  /app/frontend = customer website, /app/backend = its API (APP_MODE=public)
#   airline_admin  image tickbook/airline-admin  port 5177   admin.tickandbook.com
#                  /app/frontend = admin site,       /app/backend = admin API (APP_MODE=admin)
#
# Both read the same backend/.env and use the main MySQL database on the
# host (settings, bookings, switches), so admin changes reach the website at
# once. Staff accounts live in ADMIN_MYSQL_DATABASE. Uploaded images are in
# the shared airline_uploads volume. The APIs are not published: each is
# reached only through its own site (/api/...).
# Build: docker compose build   Server set-up: deploy/README.md
# ==========================================

x-common: &common
  restart: unless-stopped
  env_file:
    - path: ./backend/.env
      required: false
      # raw = every value exactly as written. Without it Compose treats a "$"
      # inside a value as a variable, and the Travelport passwords contain one
      # (they would reach the API changed). Needs Docker Compose 2.30+.
      format: raw
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Uploaded images (tour package posters): kept across redeploys and
    # shared, so an image uploaded on the admin site shows on the website.
    - airline_uploads:/app/backend/uploads
  networks:
    - airline_network

services:
  # 1. Airline system: customer website + its API
  airline_site:
    <<: *common
    build:
      context: .
      args:
        SITE: public
    image: ${DOCKERHUB_USERNAME:-tickbook}/airline-site:latest
    container_name: airline_site
    ports:
      # FRONTEND_BIND=127.0.0.1 once the HTTPS front door on this server is
      # the only way in (deploy/README.md); default open for LAN testing.
      # SITE_PORT / ADMIN_PORT: 5176 / 5177 by default (the server);
      # deploy/local-test.bat uses 8176 / 8177 so the dev servers can run too.
      - "${FRONTEND_BIND:-0.0.0.0}:${SITE_PORT:-5176}:80"
    environment:
      - MYSQL_HOST=host.docker.internal
      - APP_MODE=public
      # Behind nginx: read the visitor's real address (rate limits, IP blocks).
      - TRUST_PROXY_HEADERS=true

  # 2. Airline admin: admin site + the admin API (staff only, no booking)
  airline_admin:
    <<: *common
    build:
      context: .
      args:
        SITE: admin
    image: ${DOCKERHUB_USERNAME:-tickbook}/airline-admin:latest
    container_name: airline_admin
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${ADMIN_PORT:-5177}:80"
    environment:
      - MYSQL_HOST=host.docker.internal
      - APP_MODE=admin
      - TRUST_PROXY_HEADERS=true
    depends_on:
      airline_site:
        condition: service_healthy

volumes:
  airline_uploads:
    name: airline_uploads

networks:
  airline_network:
    driver: bridge
