name: Airline Booking System CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ====================================================================
  # Stage 1: Build & Push Images to Docker Hub (GitHub Cloud Runners)
  # ====================================================================
  build-and-push-docker:
    name: 🐳 1. Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Verify Frontend Build (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build and Push Airline Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-backend:${{ github.sha }}

      - name: 📦 Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-frontend:${{ github.sha }}

      - name: 📦 Build and Push Admin Site Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            SITE=admin
            NGINX_CONF=nginx.admin.conf
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-admin-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-admin-frontend:${{ github.sha }}

      - name: ✅ Confirm Docker Hub Push
        run: |
          echo "=================================================="
          echo "🎉 Airline Docker Hub Images Pushed Successfully!"
          echo "Backend:     ${{ secrets.DOCKERHUB_USERNAME }}/airline-backend:latest  (customer API + admin API)"
          echo "Website:     ${{ secrets.DOCKERHUB_USERNAME }}/airline-frontend:latest"
          echo "Admin site:  ${{ secrets.DOCKERHUB_USERNAME }}/airline-admin-frontend:latest"
          echo "=================================================="

  # ====================================================================
  # Stage 2: Deploy to Host Server (172.16.7.41)
  # ====================================================================
  deploy-to-test-server:
    name: 🚀 2. Deploy Live Stack (Host 172.16.7.41)
    needs: build-and-push-docker
    runs-on: [ self-hosted, test-server ]
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository on Server
        uses: actions/checkout@v4
        with:
          clean: false

      - name: ⚙️ Inject Backend Environment from GitHub Secrets (if provided)
        env:
          AIRLINE_BACKEND_ENV: ${{ secrets.AIRLINE_BACKEND_ENV }}
        run: |
          if [ -n "$AIRLINE_BACKEND_ENV" ]; then
            echo "$AIRLINE_BACKEND_ENV" > backend/.env
            echo "✅ Successfully generated backend/.env from GitHub Secrets!"
          fi

      - name: 🔐 Authenticate with Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 📥 Pull Latest Images from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose pull

      - name: 🚀 Start / Update Airline Containers
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose up -d --remove-orphans
          echo "Waiting for all four containers to become healthy (up to 3 minutes)..."
          for i in $(seq 1 36); do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep -vc ' healthy$' || true)
            [ "$unhealthy" = "0" ] && break
            sleep 5
          done
          docker compose ps

      - name: 🩺 Verify Server Health (website + admin site)
        run: |
          fail=0
          for target in "Website|http://127.0.0.1:5176/" "Website API|http://127.0.0.1:8005/" \
                        "Admin site|http://127.0.0.1:5177/" "Admin API|http://127.0.0.1:8006/"; do
            name="${target%%|*}"; url="${target#*|}"
            if curl -fsS -o /dev/null -m 15 "$url"; then echo "✅ $name $url"; else echo "❌ $name $url"; fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            docker compose logs airline_backend --tail 40
            docker compose logs airline_admin_backend --tail 40
            exit 1
          fi

      - name: 🌱 Run Database Migrations (Schema & Airport Lookup)
        run: |
          echo "Executing init_db() inside airline_backend..."
          docker compose exec -T airline_backend python -c "import database; database.init_db(); print('Airline DB Initialized!')"

      # Read-only Playwright checks (e2e/): pages open, the customer and admin
      # sites are separated, headers are sent. They never search, book, pay or
      # sign in. Runs in Microsoft's Playwright image, nothing to install.
      - name: 🧪 Smoke Checks (Playwright, read-only)
        run: |
          bash deploy/run-smoke.sh
          echo "=================================================="
          echo "  Deployed: website :5176   admin site :5177         "
          echo "  http://172.16.7.41:5176/   http://172.16.7.41:5177/ "
          echo "=================================================="

      - name: 📎 Keep the smoke check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
