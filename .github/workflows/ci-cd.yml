name: Airline Booking System CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ====================================================================
  # Stage 1: Build & Push Images to Docker Hub (GitHub Cloud Runners)
  # ====================================================================
  build-and-push-docker:
    name: 🐳 1. Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Verify Frontend Build (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build and Push Airline Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-backend:${{ github.sha }}

      - name: 📦 Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-frontend:${{ github.sha }}

      - name: ✅ Confirm Docker Hub Push
        run: |
          echo "=================================================="
          echo "🎉 Airline Docker Hub Images Pushed Successfully!"
          echo "Backend:  ${{ secrets.DOCKERHUB_USERNAME }}/airline-backend:latest"
          echo "Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/airline-frontend:latest"
          echo "=================================================="

  # ====================================================================
  # Stage 2: Deploy to Host Server (172.16.7.41)
  # ====================================================================
  deploy-to-test-server:
    name: 🚀 2. Deploy Live Stack (Host 172.16.7.41)
    needs: build-and-push-docker
    runs-on: [ self-hosted, test-server ]
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository on Server
        uses: actions/checkout@v4
        with:
          clean: false

      - name: ⚙️ Inject Backend Environment from GitHub Secrets (if provided)
        env:
          AIRLINE_BACKEND_ENV: ${{ secrets.AIRLINE_BACKEND_ENV }}
        run: |
          if [ -n "$AIRLINE_BACKEND_ENV" ]; then
            echo "$AIRLINE_BACKEND_ENV" > backend/.env
            echo "✅ Successfully generated backend/.env from GitHub Secrets!"
          fi

      - name: 🔐 Authenticate with Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 📥 Pull Latest Images from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose pull

      - name: 🚀 Start / Update Airline Containers
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose up -d --remove-orphans
          echo "Waiting for services to become healthy..."
          sleep 12
          docker ps --filter "name=airline_"

      - name: 🩺 Verify Server Health
        run: |
          echo "Checking Frontend availability on IPv4 (127.0.0.1:5176)..."
          curl -I http://127.0.0.1:5176/ || curl -I http://localhost:5176/ || exit 1
          echo "Checking Backend container logs and connectivity..."
          docker compose logs airline_backend --tail 30
          curl -f http://127.0.0.1:8005/ || true

      - name: 🌱 Run Database Migrations (Schema & Airport Lookup)
        run: |
          echo "Executing init_db() inside airline_backend..."
          docker compose exec -T airline_backend python -c "import database; database.init_db(); print('Airline DB Initialized!')"
          echo "=================================================="
          echo "  Airline System Deployed Successfully on Port 5176! "
          echo "  URL: http://172.16.7.41:5176/                      "
          echo "=================================================="
