name: Airline Booking System CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ====================================================================
  # Stage 1: Build & Push Images to Docker Hub (GitHub Cloud Runners)
  # ====================================================================
  build-and-push-docker:
    name: 🐳 1. Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Verify Frontend Build (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Two images from the one Dockerfile at the top of the repo (16/11/2026):
      # each holds its frontend (/app/frontend) and backend (/app/backend) and
      # runs as two containers (website + API), four in all (docker-compose.yml).
      - name: 📦 Build and Push Airline Site Image (website + its API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SITE=public
            REVISION=${{ github.sha }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-site:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-site:${{ github.sha }}

      - name: 📦 Build and Push Airline Admin Image (admin site + admin API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SITE=admin
            REVISION=${{ github.sha }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airline-admin:${{ github.sha }}

      - name: ✅ Confirm Docker Hub Push
        run: |
          echo "=================================================="
          echo "🎉 Airline Docker Hub Images Pushed Successfully!"
          echo "Airline site:  ${{ secrets.DOCKERHUB_USERNAME }}/airline-site:latest   (airline_site_frontend :5176 + airline_site_backend)"
          echo "Airline admin: ${{ secrets.DOCKERHUB_USERNAME }}/airline-admin:latest  (airline_admin_frontend :5177 + airline_admin_backend)"
          echo "=================================================="

  # ====================================================================
  # Stage 2: Deploy to Host Server (172.16.7.41)
  # ====================================================================
  deploy-to-test-server:
    name: 🚀 2. Deploy Live Stack (Host 172.16.7.41)
    needs: build-and-push-docker
    runs-on: [ self-hosted, test-server ]
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository on Server
        uses: actions/checkout@v4
        with:
          clean: false

      - name: ⚙️ Inject Backend Environment from GitHub Secrets (if provided)
        env:
          AIRLINE_BACKEND_ENV: ${{ secrets.AIRLINE_BACKEND_ENV }}
        run: |
          if [ -n "$AIRLINE_BACKEND_ENV" ]; then
            echo "$AIRLINE_BACKEND_ENV" > backend/.env
            echo "✅ Successfully generated backend/.env from GitHub Secrets!"
          fi

      - name: 🔐 Authenticate with Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 📥 Pull Latest Images from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose pull

      - name: 🚀 Start / Update Airline Containers
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Containers from earlier layouts hold ports 5176/5177 or the same names.
          for c in airline_site airline_admin airline_frontend airline_backend airline_site_frontend airline_site_backend airline_admin_frontend airline_admin_backend; do
            owner=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$c" 2>/dev/null) || continue
            [ "$owner" = "tickandbook" ] && continue
            echo "Removing $c (earlier layout)"; docker rm -f "$c" >/dev/null
          done
          docker compose up -d --remove-orphans
          echo "Waiting for all four containers to become healthy (up to 3 minutes)..."
          for i in $(seq 1 36); do
            healthy=$(docker compose ps -a --format '{{.Name}} {{.Health}}' | grep -c ' healthy$' || true)
            [ "$healthy" = "4" ] && break
            sleep 5
          done
          docker compose ps -a

      - name: 🩺 Verify Server Health (website + admin site)
        run: |
          fail=0
          for target in "Website|http://127.0.0.1:5176/|200" "Website API|http://127.0.0.1:5176/api/feature-flags|200"                         "Admin site|http://127.0.0.1:5177/|200" "Admin API (needs sign-in)|http://127.0.0.1:5177/api/admin/go-live-switches|401"; do
            IFS='|' read -r name url want <<< "$target"
            got=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$url" || true)
            if [ "$got" = "$want" ]; then echo "✅ $name $url ($got)"; else echo "❌ $name $url (got $got, want $want)"; fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            docker compose logs airline_site_backend --tail 40
            docker compose logs airline_site_frontend --tail 20
            docker compose logs airline_admin_backend --tail 40
            docker compose logs airline_admin_frontend --tail 20
            exit 1
          fi

      - name: 🌱 Run Database Migrations (Schema & Airport Lookup)
        run: |
          echo "Executing init_db() inside airline_site_backend..."
          docker compose exec -T -w /app/backend airline_site_backend python -c "import database; database.init_db(); print('Airline DB Initialized!')"

      # Read-only Playwright checks (e2e/): pages open, the customer and admin
      # sites are separated, headers are sent. They never search, book, pay or
      # sign in. Runs in Microsoft's Playwright image, nothing to install.
      - name: 🧪 Smoke Checks (Playwright, read-only)
        run: |
          bash deploy/run-smoke.sh
          echo "=================================================="
          echo "  Deployed: website :5176   admin site :5177         "
          echo "  http://172.16.7.41:5176/   http://172.16.7.41:5177/ "
          echo "=================================================="

      - name: 📎 Keep the smoke check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
